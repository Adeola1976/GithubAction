 apiVersion: apps/v1
 kind: Deployment
 metadata:
   name: algo-depl
 spec: 
   replicas: 1
   selector:
      matchLabels: 
         app: algoservice
   template:
      metadata:
         labels:
            app: algoservice
      spec:
         containers:  
            - name: algoservice
              image:adeola1976/algorithms:24043027322

---
 apiVersion: v1
 kind: Service
 metadata:
   name: algo-clusterip-srv
 spec:
   type: ClusterIP
   selector:
      app: algoservice
   ports:
      - name: algoservice
        protocol: TCP
        port: 80
        targetPort: 80


---